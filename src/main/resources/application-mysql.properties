# Perfil MySQL (por defecto). La base levelup_db se crea sola si no existe.
spring.datasource.url=jdbc:mysql://localhost:3306/levelup_db?createDatabaseIfNotExist=true&serverTimezone=America/Santiago&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USUARIO:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
