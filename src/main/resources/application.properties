# ===== Tienda Level-Up Gamer - Backend =====
spring.application.name=levelup-backend
server.port=8080

# Perfil de base de datos: mysql (por defecto) o h2 (en memoria, sin instalar nada).
# Para usar H2:  PERFIL=h2
spring.profiles.active=${PERFIL:mysql}

spring.jpa.open-in-view=false
spring.jackson.time-zone=America/Santiago

# ===== JWT =====
# Clave Base64 de 256 bits para firmar los tokens (HS256).
# En producción se debe cambiar con la variable de entorno JWT_SECRETO.
app.jwt.secreto=${JWT_SECRETO:HGkjlpB0CXA+Uft8YfJJhOyIpogSOjsRKLTkhT2nlyI=}
app.jwt.expiracion-acceso-minutos=15
app.jwt.expiracion-refresh-dias=7

# ===== CORS (orígenes del frontend, separados por coma) =====
app.cors.origenes=${CORS_ORIGENES:http://localhost:5173}

# ===== Swagger =====
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true
